<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Etch: a QR code you print once and never have to reprint</title>
    <!-- Kept under 160 characters: Google truncates around there. -->
    <meta
      name="description"
      content="Free static QR code generator. Your data goes into the pattern itself, so there is no redirect to expire. Runs in your browser. SVG, PNG and print PDF."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Site URL comes from VITE_SITE_URL at build time. A production build uses
      https://etch.vibe-coding.fans unless it is set (see vite.config.js), since
      a few crawlers still insist on an absolute og:image. The dev server leaves
      these root-relative, so the preview image resolves against whatever host
      is serving the page.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Etch" />
    <meta property="og:title" content="Etch: a QR code you print once and never have to reprint" />
    <!-- Under 125 characters, which is where mobile previews start to cut. -->
    <meta
      property="og:description"
      content="Most free QR generators encode a short link that dies with them. Etch encodes your data itself, in your browser."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Etch wordmark above the line GENERATE, PRINT, NEVER REPRINT., beside a real, scannable QR code."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Etch: a QR code you print once and never have to reprint" />
    <meta
      name="twitter:description"
      content="Static QR codes with no redirect and nothing to expire. Made entirely in your browser."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
    <meta
      name="twitter:image:alt"
      content="The Etch wordmark above the line GENERATE, PRINT, NEVER REPRINT., beside a real, scannable QR code."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Self-hosted, same-origin. There is no font CDN here, because an app
         whose claim is that nothing leaves your browser cannot then phone a
         third party for a typeface. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // localStorage only, no cookie: nothing here is sent anywhere.
      (function () {
        try {
          var saved = localStorage.getItem('etch-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {
          document.documentElement.removeAttribute('data-theme');
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Etch",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any browser",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "description": "Static QR code generator that encodes your data directly into the pattern, with no redirect, no account and no subscription. Runs entirely in the browser.",
        "isPartOf": { "@type": "WebSite", "name": "vibe-coding.fans", "url": "https://vibe-coding.fans/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
